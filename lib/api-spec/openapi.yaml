openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Hermes Agent Chat API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: agents
    description: Agent management
  - name: rooms
    description: Chat room management
  - name: messages
    description: Message operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Agents ────────────────────────────────────────────────────────────────
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{agentId}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent by ID
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    patch:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Rooms ─────────────────────────────────────────────────────────────────
  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List all rooms
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a new room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get room by ID
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "404":
          description: Not found
    patch:
      operationId: updateRoom
      tags: [rooms]
      summary: Update a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
    delete:
      operationId: deleteRoom
      tags: [rooms]
      summary: Delete a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rooms/{roomId}/members:
    get:
      operationId: listRoomMembers
      tags: [rooms]
      summary: List agents in a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: addRoomMember
      tags: [rooms]
      summary: Add an agent to a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /rooms/{roomId}/members/{agentId}:
    delete:
      operationId: removeRoomMember
      tags: [rooms]
      summary: Remove an agent from a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
        - name: agentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ── Messages ──────────────────────────────────────────────────────────────
  /rooms/{roomId}/messages:
    get:
      operationId: getRoomMessages
      tags: [messages]
      summary: Get messages in a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a user message and trigger agent responses (SSE)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream of agent responses
          content:
            text/event-stream:
              schema:
                type: string

  /rooms/{roomId}/trigger-agents:
    post:
      operationId: triggerAgentReplies
      tags: [messages]
      summary: Trigger agents to respond to latest messages (SSE)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerInput"
      responses:
        "200":
          description: SSE stream of agent-to-agent exchanges
          content:
            text/event-stream:
              schema:
                type: string

  # ── Stats ─────────────────────────────────────────────────────────────────
  /stats:
    get:
      operationId: getStats
      tags: [rooms]
      summary: Get aggregate stats across all rooms
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Agent:
      type: object
      required: [id, name, role, systemPrompt, color, apiKey, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        systemPrompt:
          type: string
        color:
          type: string
        avatarUrl:
          type: ["string", "null"]
        apiKey:
          type: string
          description: UUID key used by external agents to authenticate
        createdAt:
          type: string

    AgentInput:
      type: object
      required: [name, role, systemPrompt]
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        systemPrompt:
          type: string
          minLength: 1
        color:
          type: string
        avatarUrl:
          type: ["string", "null"]

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        role:
          type: string
        systemPrompt:
          type: string
        color:
          type: string
        avatarUrl:
          type: ["string", "null"]

    Room:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
        messageCount:
          type: ["integer", "null"]
        memberCount:
          type: ["integer", "null"]

    RoomDetail:
      type: object
      required: [id, name, description, createdAt, members]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/Agent"

    RoomInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string

    RoomUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    RoomMemberInput:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: integer

    Message:
      type: object
      required: [id, roomId, senderType, content, createdAt]
      properties:
        id:
          type: integer
        roomId:
          type: integer
        senderType:
          type: string
          enum: [user, agent]
        senderId:
          type: ["integer", "null"]
        senderName:
          type: ["string", "null"]
        senderColor:
          type: ["string", "null"]
        mentionedAgentId:
          type: ["integer", "null"]
        content:
          type: string
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
        mentionedAgentId:
          type: ["integer", "null"]

    TriggerInput:
      type: object
      properties:
        targetAgentId:
          type: ["integer", "null"]
        rounds:
          type: integer
          default: 1

    Stats:
      type: object
      required: [totalRooms, totalAgents, totalMessages]
      properties:
        totalRooms:
          type: integer
        totalAgents:
          type: integer
        totalMessages:
          type: integer
        messagesLast24h:
          type: integer
