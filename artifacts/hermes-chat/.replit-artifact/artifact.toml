kind = "web"
previewPath = "/"
title = "Hermes Agent Chat"
version = "1.0.0"
id = "artifacts/hermes-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21843

[services.development]
run = "pnpm --filter @workspace/hermes-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hermes-chat", "run", "build" ]
publicDir = "artifacts/hermes-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21843"
BASE_PATH = "/"
